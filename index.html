<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazzino</title><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#b4561f;--bd:#e3dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171614;--card:#22211f;--tx:#f0ede6;--mu:#a09c92;--ac:#e8854a;--bd:#363430}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171614;--card:#22211f;--tx:#f0ede6;--mu:#a09c92;--ac:#e8854a;--bd:#363430}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:12px 12px 150px}
h1{font-size:20px;margin:6px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:6px;overflow-x:auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row .n{flex:1;min-width:0;word-break:break-word}.row small{display:block;color:var(--mu)}
.q{min-width:34px;text-align:center;font-weight:600;font-size:18px}
button.r{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px}
button.x{border:0;background:none;color:var(--mu);font-size:13px;padding:8px}
.ban{background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:12px}
.ban b{display:block;margin-bottom:8px}
.ban button{margin:0 6px 6px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--ac);background:none;color:var(--tx);font:inherit;font-size:14px}
.ban button.p{background:var(--ac);color:#fff}
input.q{width:60px;padding:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600;font-size:18px;text-align:center}
.sw{position:relative;margin-bottom:8px;border-radius:12px;overflow:hidden;background:#c0392b}
.sw .row{margin:0;position:relative;transition:transform .2s;touch-action:pan-y}
.sw .dl{position:absolute;right:0;top:0;bottom:0;width:90px;border:0;background:#c0392b;color:#fff;font:inherit}
.row.wk{display:block}.wr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
.tg{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.tg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pl{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.pl input{width:100px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.pl select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
#cam{display:none}
.chips{display:none;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;font:inherit;font-size:14px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cs{padding:8px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.row[data-kid]{touch-action:pan-y;position:relative;transition:transform .2s}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.row .n{cursor:pointer}
.mu{color:var(--mu)}.done .n{text-decoration:line-through;color:var(--mu)}
#add{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--bg);border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;max-width:560px;margin:0 auto}
#add input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
#add button{padding:0 16px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:inherit}
</style></head><body>
<div style="display:flex;gap:8px;align-items:center"><h1 style="flex:1">Magazzino</h1><button id="lk" class="r" aria-label="Link per i colleghi">🔗</button><button id="rf" class="r" aria-label="Riordina dal minimo al massimo">🔄</button><button id="sb" class="r" aria-label="Cerca">🔍</button></div>
<div id="sqw" style="display:none;gap:8px;margin-bottom:10px"><input id="sq" placeholder="Cerca in tutte le sezioni" autocomplete="off" style="flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit"></div>
<nav id="nav"></nav>
<div id="toast"></div><div id="sub" class="chips"></div><div id="ph"></div><div id="list"></div>
<div id="add"><input id="inp" autocomplete="off"><button id="go">Aggiungi</button></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
function makeDb(c){
  const fs=getFirestore(initializeApp(c));
  return {
    collection:n=>({
      onSnapshot:(cb,er)=>onSnapshot(collection(fs,n),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),er),
      add:o=>addDoc(collection(fs,n),o)
    }),
    doc:p=>{const a=p.split("/"),r=doc(fs,a[0],a[1]);return{update:o=>updateDoc(r,o),delete:()=>deleteDoc(r)}}
  };
}

const SECS=[["kegs","Fusti collegati"],["stock","Fusti magazzino"],["triple","Triple"],["abruzzo","Abruzzo"],["bottiglie","Birre in bottiglia"],["whiskey","Whiskey"],["extra","Extra"],["cibo","Cibo"],["metro","Metro"]];
let rank={},lastR=null,wsub="",CATS=["Scozzesi","Irlandesi","Americani","Giapponesi","Italiani","Francesi","Imbottigliatori","Paesi Extra"],canCam=false,sample=null,draft=null,q="",cur="kegs",db=null,kegs=[],wk=[],items=[],asked=true,armed=null,msg="Connessione in corso…";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),"it");
const byQty=f=>(a,b)=>((a[f]||0)-(b[f]||0))||byName(a,b);
const byOrd=(a,b)=>((rank[a.id]??1e9)-(rank[b.id]??1e9))||byName(a,b);

function nav(){
  $("nav").innerHTML=SECS.map(([k,l])=>`<button data-s="${k}" class="${k===cur?"on":""}">${l}</button>`).join("");
  $("inp").placeholder=cur==="metro"?"Cosa serve dalla metro?":cur==="whiskey"?"Nuovo whiskey":(cur==="kegs"||cur==="stock")?"Nuovo tipo di fusto (es. Bionda)":"Nuovo prodotto";
  $("add").style.display=(q||cur==="kegs")?"none":"flex";
  const sb2=$("sub");sb2.style.display=(cur==="whiskey"&&!q)?"flex":"none";
  sb2.innerHTML=cur==="whiskey"?["",...CATS].map(c=>`<button data-a="wsub" data-c="${c}" class="${c===wsub?"on":""}">${c||"Tutti"}</button>`).join(""):"";
}
function stepper(id,f,v,label){
  return `<div class="row"${f==="stock"?` data-kid="${id}"`:""}><div class="n">${label}</div>
  <button class="r" data-a="inc" data-id="${id}" data-f="${f}" data-d="-1">−</button>
  <input class="q" type="number" inputmode="numeric" min="0" value="${v}" data-id="${id}" data-f="${f}" onfocus="this.select()">
  <button class="r" data-a="inc" data-id="${id}" data-f="${f}" data-d="1">+</button></div>`;
}
function delBtn(col,id){return `<button class="x" data-a="del" data-col="${col}" data-id="${id}">${armed===col+id?"Sicuro?":"Elimina"}</button>`}
const pl=k=>k.place||((k.linked||0)>0?"collegati":"magazzino");
function refreshOrder(){
  rank={};
  [...kegs].sort(byQty("stock")).forEach((k,i)=>{rank[k.id]=i});
  [...items].sort(byQty("qty")).forEach((x,i)=>{rank[x.id]=i});
  render();toast("Ordinati dal minimo al massimo");
}
function openRename(col,id,name){
  $("ph").innerHTML=`<div class="ban"><b>Rinomina</b><input id="rn" value="${esc(name)}" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px"><button class="p" data-a="rns" data-col="${col}" data-id="${id}">Salva</button><button data-a="phx">Annulla</button></div>`;
  $("rn").focus();window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const n=e.target.closest(".row .n");if(!n||!db)return;
  const el=n.closest(".row").querySelector("[data-id]");if(!el)return;
  const id=el.dataset.id;
  const col=kegs.some(x=>x.id===id)?"kegs":items.some(x=>x.id===id)?"items":wk.some(x=>x.id===id)?"whiskey":null;
  if(!col)return;
  const o=(col==="kegs"?kegs:col==="items"?items:wk).find(x=>x.id===id);
  if(o)openRename(col,id,o.name);
});
let tt=null;function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>{e.style.display="none"},2400)}
async function moveKeg(id){
  const k=kegs.find(x=>x.id===id);if(!k||!db)return;
  if(cur==="kegs"){
    if((k.linked||0)>0){toast("Porta prima a 0 i fusti collegati");return}
    await upd("kegs",id,{place:"magazzino"});toast(k.name+" spostato in magazzino");
  }else{
    if(pl(k)==="collegati"){toast("È già tra i collegati");return}
    await upd("kegs",id,{place:"collegati",linked:(k.linked||0)+1,stock:Math.max(0,(k.stock||0)-1)});toast(k.name+" collegato: scorta "+Math.max(0,(k.stock||0)-1));
  }
}
function wcard(w){
  const info=[w.tipo,w.eta?w.eta+" anni":"",w.abv?w.abv+"%":"",w.origine].filter(Boolean).join(" · "),id=w.id,tg=(f,on,t)=>`<button class="tg ${on?"on":""}" data-a="wtog" data-id="${id}" data-f="${f}">${t}</button>`;
  const pr=(f,l,v)=>`<label class="pl">${l}<input class="wf" type="number" step="0.5" min="0" inputmode="decimal" data-id="${id}" data-wf="${f}" value="${v===""||v==null?"":v}" placeholder="€" onfocus="this.select()"></label>`;
  const mn=`<label class="pl">Min. bicchieri<input class="wf" type="number" min="0" inputmode="numeric" data-id="${id}" data-wf="min" value="${w.min||0}" onfocus="this.select()"></label>`;
  return `<div class="row wk"><div class="n"><b>${esc(w.name)}</b>${info?`<small>${esc(info)}</small>`:""}</div><div class="wr">${tg("only5",w.only5,"Solo 5 cl")}${tg("closed",w.closed,"Bottiglia chiusa")}<select class="wf cs" data-id="${id}" data-wf="cat"><option value="">Categoria…</option>${CATS.map(c=>`<option ${c===w.cat?"selected":""}>${c}</option>`).join("")}</select></div><div class="wr">${w.only5?"":pr("p3","3 cl €",w.p3)}${pr("p5","5 cl €",w.p5)}${w.closed?mn:""}</div></div>`;
}
function render(){
  const L=$("list");
  if(!db){L.innerHTML=`<p class="mu">${msg}</p>`;return}
  let h="";
  const K=[...kegs].sort(byName);
  if(q){
    const s=q.toLowerCase(),lab=Object.fromEntries(SECS);
    const rk=K.filter(k=>String(k.name).toLowerCase().includes(s));
    const ri=items.filter(i=>String(i.name).toLowerCase().includes(s)).sort(byName);
    h=wk.filter(w=>String(w.name).toLowerCase().includes(s)).map(w=>`<small class="mu">Whiskey</small>`+wcard(w)+delBtn("whiskey",w.id)).join("");
    h+=rk.map(k=>`<small class="mu">Fusti magazzino</small>`+stepper(k.id,"stock",k.stock||0,esc(k.name))+delBtn("kegs",k.id)).join("");
    h+=ri.map(i=>`<small class="mu">${esc(lab[i.section]||i.section)}</small>`+(i.section==="metro"?`<div class="row ${i.done?"done":""}"><button class="r" data-a="tick" data-id="${i.id}">${i.done?"✓":"○"}</button><div class="n">${esc(i.name)}</div>${delBtn("items",i.id)}</div>`:stepper(i.id,"qty",i.qty||0,esc(i.name))+delBtn("items",i.id))).join("");
    if(!h)h=`<p class="mu">Nessun risultato per “${esc(q)}”.</p>`;
  }else if(cur==="kegs"){const K=kegs.filter(k=>pl(k)==="collegati").sort(byOrd);
    if(!K.length)h=`<p class="mu">Nessun fusto collegato. In “Fusti magazzino” scorri una birra da sinistra verso destra per collegarla.</p>`;
    else{
      if(!asked)h+=`<div class="ban"><b>Hai cambiato qualche fusto?</b>${K.map(k=>`<button data-a="swap" data-id="${k.id}">${esc(k.name)} cambiato (−1 scorta)</button>`).join("")}<button class="p" data-a="nochange">Nessun cambio</button></div>`;
      h+=K.map(k=>`<div class="row" data-kid="${k.id}"><div class="n">${esc(k.name)}<small>Scorta: ${k.stock||0}</small></div>
      <button class="r" data-a="inc" data-id="${k.id}" data-f="linked" data-d="-1">−</button><input class="q" type="number" inputmode="numeric" min="0" value="${k.linked||0}" data-id="${k.id}" data-f="linked" onfocus="this.select()">
      <button class="r" data-a="inc" data-id="${k.id}" data-f="linked" data-d="1">+</button></div>`).join("");
      h+=`<p class="mu">Il numero grande sono i fusti collegati; la scorta è in magazzino. Quando i collegati arrivano a 0, scorri la birra verso destra per spostarla in magazzino.</p>`;
    }
  }else if(cur==="whiskey"){
    {const L2=[...wk].filter(w=>!wsub||w.cat===wsub).sort(byName);
    h=L2.map(w=>wcard(w)+delBtn("whiskey",w.id)).join("")||`<p class="mu">${wsub?"Nessun whiskey in questa categoria.":"Aggiungi un whiskey qui sotto."}</p>`;}
  }else if(cur==="stock"){
    h=[...K].sort(byOrd).map(k=>stepper(k.id,"stock",k.stock||0,esc(k.name)+(pl(k)==="collegati"?`<small>Collegato · ${k.linked||0}</small>`:""))+delBtn("kegs",k.id)).join("")||`<p class="mu">Aggiungi un tipo di fusto qui sotto.</p>`;
  }else{
    const I=items.filter(i=>i.section===cur).sort(cur==="metro"?(a,b)=>(!!a.done-!!b.done)||byName(a,b):byOrd);
    if(cur==="metro"){
      h=I.map(i=>`<div class="row ${i.done?"done":""}"><button class="r" data-a="tick" data-id="${i.id}">${i.done?"✓":"○"}</button><div class="n">${esc(i.name)}</div>${delBtn("items",i.id)}</div>`).join("")||`<p class="mu">Lista vuota.</p>`;
      if(I.some(i=>i.done))h+=`<button class="x" data-a="clear">Rimuovi i presi</button>`;
    }else h=I.map(i=>stepper(i.id,"qty",i.qty||0,esc(i.name))+delBtn("items",i.id)).join("")||`<p class="mu">Nessun prodotto. Aggiungine uno qui sotto.</p>`;
  }
  L.innerHTML=h;
  L.querySelectorAll('button[data-a="del"]').forEach(b=>{
    const row=b.parentElement.classList.contains("row")?b.parentElement:b.previousElementSibling;
    const col=b.dataset.col,id=b.dataset.id;b.remove();
    if(!row||!row.classList.contains("row"))return;
    const w=document.createElement("div");w.className="sw";
    row.parentNode.insertBefore(w,row);
    const dl=document.createElement("button");dl.className="dl";dl.textContent="Elimina";
    dl.dataset.a="del2";dl.dataset.col=col;dl.dataset.id=id;
    w.append(dl,row);
  });
}
async function upd(col,id,data){try{await db.doc(col+"/"+id).update(data)}catch(e){msg="Impossibile salvare: non hai il permesso di modificare.";alert(msg)}}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!db&&!b.dataset.s&&b.dataset.a!=="cfgok")return;
  const d=b.dataset;
  if(d.s){cur=d.s;q="";$("sq").value="";$("sqw").style.display="none";armed=null;nav();render();return}
  if(d.a==="nochange"){asked=true;render();return}
  if(d.a==="swap"){const k=kegs.find(x=>x.id===d.id);if(k)await upd("kegs",k.id,{stock:Math.max(0,(k.stock||0)-1)});asked=true;render();return}
  if(d.a==="inc"){const col=(d.f==="qty")?"items":"kegs";const o=(col==="items"?items:kegs).find(x=>x.id===d.id);if(o)await upd(col,o.id,{[d.f]:Math.max(0,(o[d.f]||0)+Number(d.d))});return}
  if(d.a==="tick"){const o=items.find(x=>x.id===d.id);if(o)await upd("items",o.id,{done:!o.done});return}
  if(d.a==="clear"){for(const o of items.filter(i=>i.section==="metro"&&i.done))await db.doc("items/"+o.id).delete();return}
  if(d.a==="rns"){const v=$("rn").value.trim();if(!v){$("rn").focus();return}await upd(d.col,d.id,{name:v});$("ph").innerHTML="";return}
  if(d.a==="wsub"){wsub=d.c;nav();render();return}
  if(d.a==="cfgok"){const c=parseCfg($("cfgt").value);if(!c){showSetup("Configurazione non riconosciuta: copia tutto il blocco firebaseConfig.");return}try{localStorage.setItem("fbcfg",JSON.stringify(c))}catch(e){}start(c);return}
  if(d.a==="lkc"){const i=$("lku");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){}toast("Link copiato");return}
  if(d.a==="phx"){$("ph").innerHTML="";return}
  if(d.a==="wtog"){const w=wk.find(x=>x.id===d.id);if(w)await upd("whiskey",w.id,{[d.f]:!w[d.f]});return}
  if(d.a==="del2"){try{await db.doc(d.col+"/"+d.id).delete()}catch(x){alert("Non hai il permesso di eliminare.")}return}
  if(d.a==="del"){const key=d.col+d.id;if(armed!==key){armed=key;render();return}armed=null;try{await db.doc(d.col+"/"+d.id).delete()}catch(x){alert("Non hai il permesso di eliminare.")}}
});
document.addEventListener("change",e=>{
  const t=e.target;if(!t.classList||!t.classList.contains("q")||!db)return;
  const n=Math.max(0,Math.floor(Number(t.value))||0);
  upd(t.dataset.f==="qty"?"items":"kegs",t.dataset.id,{[t.dataset.f]:n});
});
let sx=0,sy=0,sw=null,moved=false;
function closeAll(except){document.querySelectorAll(".sw .row").forEach(r=>{if(r!==except){r.style.transform="";delete r.dataset.open}})}
document.addEventListener("touchstart",e=>{
  const r=e.target.closest(".sw .row,.row[data-kid]");closeAll(r);
  if(!r){sw=null;return}
  sw=r;const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;r.style.transition="none";
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!sw)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(!moved&&Math.abs(dy)>Math.abs(dx)){sw.style.transition="";sw=null;return}
  moved=true;const base=sw.dataset.open?-90:0;
  const lo=sw.closest(".sw")?-90:0,hi=sw.dataset.kid?120:0;sw.style.transform=`translateX(${Math.max(lo,Math.min(hi,base+dx))}px)`;
},{passive:true});
document.addEventListener("touchend",()=>{
  if(!sw)return;
  const m=sw.style.transform.match(/-?\d+/),x=m?Number(m[0]):0;
  sw.style.transition="";
  if(x>70&&sw.dataset.kid){const kid=sw.dataset.kid;sw.style.transform="";sw=null;moveKeg(kid);return}
  if(x<-45){sw.style.transform="translateX(-90px)";sw.dataset.open=1}
  else{sw.style.transform="";delete sw.dataset.open}
  sw=null;
});
$("rf").onclick=refreshOrder;
$("sb").onclick=()=>{const w=$("sqw"),s=$("sq");if(w.style.display==="none"){w.style.display="flex";s.focus()}else{w.style.display="none";s.value="";q="";nav();render()}};
$("sq").addEventListener("input",e=>{q=e.target.value.trim();nav();render()});
document.addEventListener("change",e=>{
  const t=e.target;if(!t.classList||!t.classList.contains("wf")||!db)return;
  const f=t.dataset.wf;if(f==="cat"){upd("whiskey",t.dataset.id,{cat:t.value});return}let v=t.value===""?"":Math.max(0,Number(t.value)||0);
  if(f==="min")v=Math.floor(v||0);
  upd("whiskey",t.dataset.id,{[f]:v});
});
async function add(){
  const v=$("inp").value.trim();if(!v||!db)return;$("inp").value="";
  try{
    if(cur==="whiskey")await db.collection("whiskey").add({name:v,cat:wsub,p3:"",p5:"",only5:false,closed:true,min:0});else if(cur==="stock")await db.collection("kegs").add({name:v,place:"magazzino",linked:0,stock:0});
    else await db.collection("items").add({section:cur,name:v,qty:0,done:false});
  }catch(e){alert("Non hai il permesso di modificare.")}
}
$("go").onclick=add;$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
nav();render();
let cfg=null;
function parseCfg(t){const c={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=t.match(new RegExp(k+"[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));if(m)c[k]=m[1]});return(c.apiKey&&c.projectId&&c.appId)?c:null}
function showSetup(err){
  $("ph").innerHTML=`<div class="ban"><b>Collega il database</b>Incolla qui la configurazione Firebase, quella che contiene apiKey e projectId.${err?`<br><span style="color:#c0392b">${err}</span>`:""}<textarea id="cfgt" rows="7" style="width:100%;margin:8px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:13px monospace"></textarea><button class="p" data-a="cfgok">Collega</button></div>`;
}
function start(c){
  cfg=c;
  try{db=makeDb(c)}catch(e){db=null;showSetup("Configurazione non valida.");return}
  $("ph").innerHTML="";
  const er=()=>toast("Errore di collegamento: controlla internet e le regole di Firestore");
  db.collection("kegs").onSnapshot(s=>{kegs=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
  db.collection("whiskey").onSnapshot(s=>{wk=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
  db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
  render();
}
$("lk").onclick=()=>{
  if(!cfg)return;
  const u=location.origin+location.pathname+"#cfg="+btoa(JSON.stringify(cfg));
  $("ph").innerHTML=`<div class="ban"><b>Link per i colleghi</b>Chi lo apre si collega da solo al magazzino. Mandalo solo a chi lavora con te.<input id="lku" readonly value="${u}" style="width:100%;margin:8px 0;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit"><button class="p" data-a="lkc">Copia</button><button data-a="phx">Chiudi</button></div>`;
  window.scrollTo(0,0);
};
(function(){try{const m=location.hash.match(/cfg=([^&]+)/);if(m){cfg=JSON.parse(atob(m[1]));localStorage.setItem("fbcfg",JSON.stringify(cfg));history.replaceState(null,"",location.pathname+location.search)}else cfg=JSON.parse(localStorage.getItem("fbcfg")||"null")}catch(e){}})();
if(cfg)start(cfg);else{msg="Benvenuto! Collega prima il database.";render();showSetup("")}
